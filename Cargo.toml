[package]
name = "rust-rabbit"
version = "0.1.0"
edition = "2021"
description = "A Rust library similar to MassTransit for RabbitMQ messaging with publisher/consumer pattern and advanced retry mechanisms"
license = "MIT"
authors = ["Minh Nghĩa <nghiaphamln3@gmail.com>"]
repository = "https://github.com/nghiaphamln/rust-rabbit"
readme = "README.md"
keywords = ["rabbitmq", "messaging", "amqp", "queue", "masstransit"]
categories = ["network-programming", "asynchronous"]

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }

# RabbitMQ client
lapin = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = "0.3"

# Time handling
chrono = { version = "0.4", features = ["serde"] }
tokio-util = "0.7"

# Async traits
async-trait = "0.1"

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# Connection pooling and utilities
futures = "0.3"
futures-util = "0.3"

# Configuration
config = "0.14"

# Random number generation
fastrand = "2.0"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"