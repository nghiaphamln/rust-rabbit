[package]
name = "rust-rabbit"
version = "1.0.0"
edition = "2021"
description = "A simple, reliable RabbitMQ client library for Rust. Easy to use with flexible retry mechanisms and minimal configuration."
license = "MIT"
authors = ["Minh Nghĩa <nghiaphamln3@gmail.com>"]
repository = "https://github.com/nghiaphamln/rust-rabbit"
readme = "README.md"
keywords = ["rabbitmq", "messaging", "amqp", "queue", "simple"]
categories = ["network-programming", "asynchronous"]

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }

# RabbitMQ client
lapin = "2.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"

# Logging
tracing = "0.1"

# Time handling for retry delays
chrono = { version = "0.4", features = ["serde"] }

# URL parsing for connection strings
url = "2.0"

# Fast random number generation for examples
fastrand = "2.3.0"

# Stream utilities for consumer
futures-lite = "2.0"

[dev-dependencies]
tokio-test = "0.4"
anyhow = "1.0"
tracing-test = "0.2"
tracing-subscriber = "0.3"
