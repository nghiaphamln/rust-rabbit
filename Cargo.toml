[package]
name = "rust-rabbit"
version = "0.3.2"
edition = "2021"
description = "A high-performance, production-ready RabbitMQ client library for Rust with zero-configuration simplicity, advanced retry patterns, enterprise messaging patterns, and comprehensive observability. Features one-line setup, automatic retry policies, Request-Response/Saga/Event Sourcing patterns, Prometheus metrics, and circuit breaker resilience."
license = "MIT"
authors = ["Minh Nghĩa <nghiaphamln3@gmail.com>"]
repository = "https://github.com/nghiaphamln/rust-rabbit"
readme = "README.md"
keywords = ["rabbitmq", "messaging", "amqp", "queue", "masstransit"]
categories = ["network-programming", "asynchronous"]

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }

# RabbitMQ client
lapin = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = "0.3"

# Time handling
chrono = { version = "0.4", features = ["serde"] }
tokio-util = "0.7"

# Async traits
async-trait = "0.1"

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# Connection pooling and utilities
futures = "0.3"
futures-util = "0.3"

# Configuration
config = "0.14"

# Random number generation
fastrand = "2.0"

# Metrics and observability
prometheus = "0.14"
metrics = "0.22"
metrics-prometheus = "0.11"

# Force secure version of protobuf due to RUSTSEC-2024-0437
protobuf = ">=3.7.2"

[dev-dependencies]
# Web server for metrics endpoint in examples
warp = "0.3"
tokio-test = "0.4"
mockall = "0.12"
anyhow = "1.0"
tracing-test = "0.2"